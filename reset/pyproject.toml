[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reset-decoding"
version = "0.1.0"
description = "ReSET: Reasoning Step Entropy-based Temperature Scaling (vLLM logits processor)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch"]

[tool.setuptools]
packages = ["reset"]
