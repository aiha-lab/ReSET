[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reset-decoding"
version = "0.1.0"
description = "ReSET: Reasoning Step Entropy-based Temperature Scaling (vLLM logits processor)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch"]

[project.scripts]
reset-run = "run_reset:main"
reset-quantize = "quantize:main"

[tool.setuptools]
packages = ["reset"]
py-modules = ["run_reset", "quantize"]
